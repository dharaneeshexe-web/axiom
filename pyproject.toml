[project]
name = "razorpay-conversational-checkout"
version = "1.0.0"
description = "An autonomous agent that completes transactions on behalf of users using Razorpay"
authors = [
    {name = "Dharaneesh N", email = "dharaneeshexe@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.25.0",
    "groq>=0.4.0",
    "langgraph>=0.0.20",
    "langchain-core>=0.1.0",
    "python-dotenv>=1.0.0",
    "lmnr>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
start = "uvicorn.main:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
